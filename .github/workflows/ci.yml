name: CI (TypeScript & Roadmap Gate)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Vitest & Roadmap Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate roadmap manifest
        run: node scripts/validate-roadmap.js .github/roadmap.json

      - name: Unit tests (Vitest)
        run: npm test

      - name: Frontend production build
        run: npm run build

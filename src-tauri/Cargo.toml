[package]
name = "morrow-editor"
version = "0.1.0"
description = "A small, local-first text and code editor"
authors = ["Morrow contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "morrow_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
